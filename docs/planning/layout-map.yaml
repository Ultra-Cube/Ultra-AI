# Ultra-AI Repository Layout Map (WP-0 deliverable)
# Generated from ACTUAL repository contents on 2026-11-11 (branch release/planning-study).
# Authoritative for the staged reorganization in ULTRA_AI_BUILD_PROMPT.md §4/§4.1.
# Owner decisions applied (see ERRATA & OWNER DECISIONS in ULTRA_AI_BUILD_PROMPT.md):
#   - contracts/            -> platform/api/contracts/          (Option A)
#   - memory/ (project)     -> brain-stack/memory/ops/          (Option A)
#   - skills/ (root)        -> brain-stack/skills/legacy/       (Option A)
#   - environments/ = root *.env.example per environment;
#     control/config/env/ = internal service env templates.
#   - monitoring/hermes -> infrastructure/monitoring/legacy-hermes (temporary);
#     monitoring/sentinel is a WP-2 CREATE task, NOT a move.
#   - packages/*, services/*, apps/* enumerated individually below.
#   - dotfiles = .devin/ .cursor/ .github/ (+ .claude/ .cortex/ .kombai/ .husky/ .turbo/)
#   - build caches (*.tsbuildinfo, dist/, .turbo/, .next/) gitignored, never moved.

meta:
  version: 1.0
  generated: "2026-11-11"
  baseline_tag: baseline/pre-planning-20261111
  naming: lowercase-kebab-case
  rule: "package names @ultra-ai/* do NOT change; only directories move"

# ---------------------------------------------------------------------------
# STEP 0 — exclusions: never moved, never committed
# ---------------------------------------------------------------------------
exclusions:
  - { path: node_modules/,            action: stay, reason: "npm install artifact" }
  - { path: release-assets/,          action: stay, reason: "local release bundle/tarball; gitignored" }
  - { path: external/,                action: stay, reason: "local-only: github-forks + mdskills-catalog; gitignored" }
  - { path: .git/,                    action: stay, reason: "VCS internals" }
  - { path: .turbo/,                  action: stay, reason: "turbo cache; gitignored" }
  - { path: "**/*.tsbuildinfo",       action: stay, reason: "build cache; gitignored" }
  - { path: "**/dist/", "**/.next/", "**/coverage/", action: stay, reason: "build artifacts" }
  - { path: external-integrations/,   action: stay-pending-manifest, reason: "contains local-only content + 20+ third-party repos; requires owner-run manifest-local BEFORE any git mv" }
  - { path: wsl-ai-stack/,            action: stay-pending-manifest, reason: "local WSL runtime stack + airllm_run.log; requires owner-run manifest-local BEFORE any git mv" }

# ---------------------------------------------------------------------------
# STEP 1 — files WE created post-baseline (new-file moves, lowest risk)
# ---------------------------------------------------------------------------
step1_new_files:
