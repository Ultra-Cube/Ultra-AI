# ---------------------------------------------------------------------------
# ENV RULE (owner-approved distinction)
# ---------------------------------------------------------------------------
env_rule:
  environments/:        "root-level *.env.example per environment (development/staging/production/testing) + manage-environment.sh; only *.example tracked"
  control/config/env/:  "internal service env TEMPLATES (docker, database, nginx, monitoring, security)"
  action: ".env.example -> environments/development.env.example"

