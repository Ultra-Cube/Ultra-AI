  - { src: ultra-ai-v2/skills,            dst: brain-stack/skills/ultra-ai-v2,   note: "v2 skill set (33 skills); keep separate from legacy" }
  - { src: ultra-ai-v2/plugin,            dst: brain-stack/plugin,               note: "plugin ultra-ai-builder (agents/commands/hooks)" }
  - { src: ultra-ai-v2/memory,            dst: brain-stack/memory/planning,      note: "S1-S2b planning memory bank" }
  - { src: ultra-ai-v2/diagrams,          dst: brain-stack/memory/diagrams,      note: "116 extracted+validated Mermaid registry" }
  # NOTE: root memory/ does NOT exist (verified 2026-11-11: no tracked files, no dir on disk).
  # brain-stack/memory/ops is therefore a NEW placeholder (see placeholders section), not a move.
  # Owner decision A still stands: live project ops-memory lives under brain-stack/memory/ops.
  # skills created by us at repo root
  - { src: skills/,                       dst: brain-stack/skills/legacy,        note: "owner decision A: legacy/imported skills (skills/devops/{architecture-review,kanban-orchestrator,kanban-worker}); inspect before merge" }
  # planning docs authored post-baseline
  - { src: ULTRA_AI_SUPER_PROMPT.md,      dst: brain-stack/prompts/ultra-ai-master-build.md }
  - { src: ULTRA_AI_BUILD_PROMPT.md,      dst: brain-stack/prompts/ultra-ai-build-prompt.md }
  - { src: ULTRA_AI_TODO.md,              dst: brain-stack/workflows/ULTRA_AI_TODO.md }
  - { src: ULTRA_AI_MASTER_PLAN_LATEST.md,dst: docs/v2/master-plan.md }
  - { src: ULTRA_AI_V2_TECHNICAL_SPEC.md, dst: docs/v2/technical-spec.md }
  - { src: ULTRA_AI_LEGAL_LICENSING.md,   dst: docs/v2/legal-licensing.md }
  - { src: PLANNING_RELEASE_NOTES.md,     dst: docs/v2/release-notes-v0.2.0-planning.md }
  - { src: PLANNING_BASELINE_1aa16b6.sha256,    dst: distribution/assets/releases/v0.2.0-planning/PLANNING_BASELINE_1aa16b6.sha256 }
  - { src: PLANNING_BASELINE_c863ef8.sha256,    dst: distribution/assets/releases/v0.2.0-planning/PLANNING_BASELINE_c863ef8.sha256 }
  - { src: DOC_CONVERSION_MAP.csv,        dst: docs/v2/doc-conversion-map.csv }
  - { src: llms.txt,                      dst: docs/v2/llms.txt,                 note: "verify content is v2-scoped before moving; else stay" }
  # legal/licensing material (real file is licence matrix in root legal/ + docs)
  - { src: legal/,                        dst: control/compliance/licensing/legal-docs, note: "currently EMPTY dir; create only if files appear; licence_matrix.yaml authored under control/compliance/licensing/" }
  # scripts authored post-baseline (preservation tooling)
  - { src: scripts/preservation.sh,       dst: infrastructure/automation/preservation.sh }

