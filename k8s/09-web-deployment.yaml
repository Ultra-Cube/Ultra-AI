apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ultra-ai
  labels:
    app: web
    version: "1.0.0"
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: web
  
  template:
    metadata:
      labels:
        app: web
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
    
    spec:
      serviceAccountName: web-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - web
                topologyKey: kubernetes.io/hostname
        
        # Pod affinity with API
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api
                topologyKey: topology.kubernetes.io/zone
      
      containers:
        - name: web
          image: ultra-ai-web:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          
          env:
            # Frontend Configuration
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_API_URL
            - name: NEXT_PUBLIC_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_ENVIRONMENT
            
            # Feature Flags
            - name: NEXT_PUBLIC_FEATURE_DARK_MODE
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_FEATURE_DARK_MODE
            - name: NEXT_PUBLIC_FEATURE_MULTI_LANGUAGE
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_FEATURE_MULTI_LANGUAGE
            - name: NEXT_PUBLIC_FEATURE_NOTIFICATIONS
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_FEATURE_NOTIFICATIONS
            
            # Analytics
            - name: NEXT_PUBLIC_ANALYTICS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: NEXT_PUBLIC_ANALYTICS_ENABLED
            
            # Node Environment
            - name: NODE_ENV
              value: "production"
          
          volumeMounts:
            - name: logs
              mountPath: /var/log/web
            - name: cache
              mountPath: /app/.next/cache
          
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
      
      volumes:
        - name: logs
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 500Mi
      
      terminationGracePeriodSeconds: 20
      dnsPolicy: ClusterFirst
      restartPolicy: Always

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-sa
  namespace: ultra-ai
  labels:
    app: web

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: web-role
  namespace: ultra-ai
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: web-rolebinding
  namespace: ultra-ai
subjects:
  - kind: ServiceAccount
    name: web-sa
    namespace: ultra-ai
roleRef:
  kind: Role
  name: web-role
  apiGroup: rbac.authorization.k8s.io

---
# Pod Disruption Budget for Web
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: ultra-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
