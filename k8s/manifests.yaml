---
# Kubernetes Namespace for Ultra AI Platform
apiVersion: v1
kind: Namespace
metadata:
  name: ultra-ai
  labels:
    name: ultra-ai

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ultra-ai-config
  namespace: ultra-ai
data:
  NODE_ENV: production
  LOG_LEVEL: info
  API_PORT: "4000"
  WEB_PORT: "3000"
  P2P_PORT: "5000"
  MIN_REPUTATION_FOR_REWARDS: "30"
  DATA_RETENTION_DAYS: "90"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  CORS_ORIGINS: "https://ultra-ai.com,https://www.ultra-ai.com"
  BLOCKCHAIN_NETWORK: "ethereum"
  CONTRACT_ADDRESS: "0x..."

---
# API Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ultra-ai
  labels:
    app: api
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api-sa
      containers:
      - name: api
        image: ultra-ai/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: jwt-secret
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: ultra-ai-config
              key: NODE_ENV
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: ultra-ai-config
              key: CORS_ORIGINS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false

---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: ultra-ai
spec:
  selector:
    app: api
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http

---
# Web Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ultra-ai
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: ultra-ai/web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.ultra-ai.com"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
# Web Service
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: ultra-ai
spec:
  selector:
    app: web
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP

---
# P2P Distributed Node Deployment
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: p2p-node
  namespace: ultra-ai
spec:
  serviceName: p2p-service
  replicas: 3
  selector:
    matchLabels:
      app: p2p-node
  template:
    metadata:
      labels:
        app: p2p-node
    spec:
      containers:
      - name: p2p-node
        image: ultra-ai/distributed:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: p2p
        env:
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NETWORK_PORT
          value: "5000"
        - name: BLOCKCHAIN_ENABLED
          value: "true"
        - name: ENCRYPTION_ENABLED
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: node-data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: node-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
# P2P Service
apiVersion: v1
kind: Service
metadata:
  name: p2p-service
  namespace: ultra-ai
spec:
  selector:
    app: p2p-node
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP

---
# Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ultra-ai-ingress
  namespace: ultra-ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ultra-ai.com
    - api.ultra-ai.com
    - www.ultra-ai.com
    secretName: ultra-ai-tls
  rules:
  - host: ultra-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 3000
  - host: www.ultra-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 3000
  - host: api.ultra-ai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 4000

---
# ServiceAccount for API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: ultra-ai

---
# Role for API
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-role
  namespace: ultra-ai
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "watch", "list"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]

---
# RoleBinding for API
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-rolebinding
  namespace: ultra-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-role
subjects:
- kind: ServiceAccount
  name: api-sa
  namespace: ultra-ai

---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: ultra-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# PodDisruptionBudget for API
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: ultra-ai
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api

---
# NetworkPolicy to restrict traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ultra-ai-netpolicy
  namespace: ultra-ai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ultra-ai
  egress:
  - to:
    - namespaceSelector: {}
