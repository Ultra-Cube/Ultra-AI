apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ultra-ai
type: Opaque
stringData:
  # Database Secrets
  DATABASE_PASSWORD: "postgres"
  DATABASE_REPLICA_PASSWORD: "postgres"
  
  # MongoDB Replica Set Key
  MONGODB_KEYFILE: |
    secretKeyHereChangeInProduction1234567890
  
  # Redis Password
  REDIS_PASSWORD: ""
  
  # JWT Secrets
  JWT_SECRET: "your-secure-jwt-secret-key-change-in-production"
  JWT_REFRESH_SECRET: "your-secure-jwt-refresh-secret-key-change-in-production"
  JWT_EXPIRES_IN: "24h"
  JWT_REFRESH_EXPIRES_IN: "7d"
  
  # API Keys
  API_KEY_SECRET: "your-api-key-secret-change-in-production"
  
  # Encryption Keys
  ENCRYPTION_KEY: "your-encryption-key-32-characters-change-in-production"
  ENCRYPTION_IV: "your-iv-16-characters"
  
  # OAuth/Social Login (if enabled)
  OAUTH_CLIENT_ID: "change-in-production"
  OAUTH_CLIENT_SECRET: "change-in-production"
  
  # Email Configuration (if enabled)
  EMAIL_SERVICE_API_KEY: "change-in-production"
  EMAIL_FROM: "noreply@ultra-ai.local"
  
  # S3/Storage Configuration (if enabled)
  AWS_ACCESS_KEY_ID: "change-in-production"
  AWS_SECRET_ACCESS_KEY: "change-in-production"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "ultra-ai-storage"
  
  # IPFS Configuration (if enabled)
  IPFS_API_URL: "http://ipfs:5001"
  IPFS_GATEWAY_URL: "http://ipfs:8080"
  
  # Webhook Encryption
  WEBHOOK_ENCRYPTION_KEY: "your-webhook-encryption-key-change-in-production"
  
  # GraphQL Secret
  GRAPHQL_PLAYGROUND_ENABLED: "false"
  GRAPHQL_INTROSPECTION_ENABLED: "false"
  
  # Blockchain/Web3 Configuration (if enabled)
  WEB3_PROVIDER_URL: "https://eth-mainnet.alchemyapi.io/v2/your-key"
  CONTRACT_ADDRESS: "0x..."
  CONTRACT_ABI: '[]'
  PRIVATE_KEY: "change-in-production"

---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: ultra-ai
type: Opaque
stringData:
  postgres-username: "postgres"
  postgres-password: "postgres"
  mongodb-username: "admin"
  mongodb-password: "password"
  mongodb-replica-key: "your-replica-key-change-in-production"

