apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ultra-ai
  labels:
    app: api
    version: "1.0.0"
    environment: production
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  
  selector:
    matchLabels:
      app: api
  
  template:
    metadata:
      labels:
        app: api
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    
    spec:
      serviceAccountName: api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Pod Disruption Budget for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: node-type
                    operator: In
                    values:
                      - compute
      
      containers:
        - name: api
          image: ultra-ai-api:latest
          imagePullPolicy: Always
          
          ports:
            - containerPort: 5555
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          
          env:
            # Database Configuration
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DATABASE_URL
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD
            
            # Redis Configuration
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: REDIS_URL
            
            # MongoDB Configuration
            - name: MONGODB_URL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MONGODB_URL
            
            # API Configuration
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: API_PORT
            - name: API_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: API_HOST
            
            # JWT Secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: JWT_REFRESH_SECRET
            
            # Feature Flags
            - name: FEATURE_GRAPHQL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: FEATURE_GRAPHQL
            - name: FEATURE_ANALYTICS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: FEATURE_ANALYTICS
            - name: FEATURE_WEBHOOKS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: FEATURE_WEBHOOKS
            
            # Logging
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: LOG_LEVEL
          
          volumeMounts:
            - name: logs
              mountPath: /var/log/api
            - name: config
              mountPath: /etc/api
            - name: cache
              mountPath: /tmp/cache
          
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 15
      
      volumes:
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: api-config
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
      
      # Termination grace period for graceful shutdown
      terminationGracePeriodSeconds: 30
      
      # DNS Policy
      dnsPolicy: ClusterFirst
      
      # Restart Policy
      restartPolicy: Always

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: ultra-ai
  labels:
    app: api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-role
  namespace: ultra-ai
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-rolebinding
  namespace: ultra-ai
subjects:
  - kind: ServiceAccount
    name: api-sa
    namespace: ultra-ai
roleRef:
  kind: Role
  name: api-role
  apiGroup: rbac.authorization.k8s.io

---
# Pod Disruption Budget for API
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: ultra-ai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
