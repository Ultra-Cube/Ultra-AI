apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ultra-ai
  labels:
    app: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 5555
      targetPort: 5555
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ultra-ai
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

---
# LoadBalancer Service (optional for external access)
apiVersion: v1
kind: Service
metadata:
  name: api-loadbalancer
  namespace: ultra-ai
  labels:
    app: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - name: http
      port: 5555
      targetPort: 5555
      protocol: TCP
  loadBalancerSourceRanges:
    - 0.0.0.0/0
  externalTrafficPolicy: Local
  sessionAffinity: ClientIP

---
# LoadBalancer Service for Web
apiVersion: v1
kind: Service
metadata:
  name: web-loadbalancer
  namespace: ultra-ai
  labels:
    app: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
    - name: https
      port: 443
      targetPort: 3000
      protocol: TCP
  loadBalancerSourceRanges:
    - 0.0.0.0/0
  externalTrafficPolicy: Local

---
# Internal Endpoint Service
apiVersion: v1
kind: Endpoints
metadata:
  name: database
  namespace: ultra-ai
subsets:
  - addresses:
      - ip: postgres
    ports:
      - port: 5432

---
# Service Monitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-monitor
  namespace: ultra-ai
  labels:
    app: api
spec:
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics

---
# Headless Service for StatefulSets API (for DNS records)
apiVersion: v1
kind: Service
metadata:
  name: api-headless
  namespace: ultra-ai
  labels:
    app: api
spec:
  clusterIP: None
  selector:
    app: api
  ports:
    - name: http
      port: 5555
      targetPort: 5555
      protocol: TCP

---
# ExternalName Service for external API (example)
apiVersion: v1
kind: Service
metadata:
  name: external-api
  namespace: ultra-ai
spec:
  type: ExternalName
  externalName: api.example.com
  ports:
    - port: 443
      protocol: TCP

---
# Internal DNS Service for database
apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: ultra-ai
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
