# brain.config.yaml — local-model "brain" provider for Hermes / Ultra-AI
# -----------------------------------------------------------------------------
# SCAFFOLD ONLY. This host has NO GPU and ~1.3 GB free RAM — do not run local
# inference here. Deploy this on a GPU host, then merge the `custom-provider`
# block below into your live Hermes config at:
#     ~/.hermes/config.yaml        (or $HERMES_HOME/config.yaml)
#
# The local inference server must speak the OpenAI-compatible API (the `/v1`
# routes: /v1/models, /v1/chat/completions). vLLM, llama.cpp's llama-server, and
# the AirLLM FastAPI shim in run-airllm-server.sh all satisfy this.
# -----------------------------------------------------------------------------

# --- Hermes custom provider block --------------------------------------------
# Paste/merge this under your Hermes config's providers section. Field names
# follow the Hermes custom-provider convention; adjust to match your installed
# Hermes version if it differs.
providers:
  local-brain:
    type: custom                      # custom OpenAI-compatible provider
    base_url: http://localhost:8000/v1   # where the local inference server listens
    api_key: "not-needed-for-local"      # local servers usually ignore this; set if your server requires one
    # `model` is the id the inference server advertises at /v1/models. This is a
    # PLACEHOLDER — replace with the model you actually serve (must match
    # --served-model-name / the repo id the server reports).
    model: local-model                   # e.g. meta-llama/Meta-Llama-3.1-8B-Instruct
    # Optional tuning:
    # request_timeout: 120               # AirLLM is slow per token — raise timeouts generously
    # max_tokens: 1024

# Example: select this provider/model when launching Hermes (syntax depends on
# your Hermes version — illustrative):
#   Model: local-brain/local-model
#   Provider: custom

# -----------------------------------------------------------------------------
# Notes: which engine serves base_url
# -----------------------------------------------------------------------------
# 1) vLLM (PREFERRED when the model fits in VRAM) — throughput + batching:
#      python -m vllm.entrypoints.openai.api_server \
#        --model meta-llama/Meta-Llama-3.1-8B-Instruct \
#        --served-model-name local-model \
#        --host 0.0.0.0 --port 8000
#    -> serves http://localhost:8000/v1 directly. Set `model: local-model` above.
#
# 2) llama.cpp (PREFERRED for CPU / quantized GGUF) — faster than AirLLM on CPU:
#      ./llama-server -m model.gguf --host 0.0.0.0 --port 8000
#    -> OpenAI-compatible /v1 built in.
#
# 3) AirLLM (ONLY when the model is far bigger than VRAM, e.g. 70B on 4–8 GB) —
#    layer-by-layer streaming from disk; slow, no built-in OpenAI server, so the
#    run-airllm-server.sh shim wraps it in FastAPI to expose /v1/chat/completions.
#      - venv: /opt/data/venvs/airllm  (install CUDA torch on the GPU host)
#      - see the `airllm` skill and run-airllm-server.sh in this directory
#      - expect minutes per completion; raise request_timeout above accordingly.
#
# Rule of thumb: vLLM if it fits, llama.cpp for CPU/quantized, AirLLM only when
# the model won't otherwise fit at all.
