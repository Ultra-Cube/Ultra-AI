# Hermes Alertmanager configuration
# Default route logs/groups alerts. Wire a real receiver (Slack/PagerDuty/
# email) by filling in the commented blocks and setting the webhook secret
# via environment at deploy time -- do not commit real credentials.
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Example Slack receiver (fill api_url via a secret-injected overlay):
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#ultra-ai-alerts'
    #     send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ['alertname']
