version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://user:password@db:5432/ultra-ai
    depends_on:
      - db
      - redis
    networks:
      - ultra-ai-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ultra-ai
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ultra-ai-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ultra-ai-network

  api-gateway:
    build:
      context: ./platform/api/gateway
      dockerfile: ./Dockerfile
    ports:
      - "20129:20129"
    networks:
      - ultra-ai-network

  control-center:
    build:
      context: ./platform/devtools/control-center
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    networks:
      - ultra-ai-network

  ultra-core-mock:
    image: node:20-alpine
    working_dir: /repo
    command: npx tsx platform/services/ultra-core-bridge/src/mock-server.ts
    ports:
      - "4100:4100"
    volumes:
      - ../../:/repo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ultra-ai-network

  # Hermes OpenAI bridge — exposes HermesRuntime as /v1/chat/completions
  # so Open WebUI can use Hermes as a model provider (port 9400).
  hermes-openai-bridge:
    image: node:20-alpine
    working_dir: /repo
    command: sh -c "npm run build -w @ultra-ai/hermes-runtime --if-present && npx tsx platform/services/hermes-openai-bridge/src/index.ts"
    ports:
      - "9400:9400"
    volumes:
      - ../../:/repo
    environment:
      - HERMES_OPENAI_PORT=9400
      - HERMES_UPSTREAM_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ultra-ai-network

volumes:
  postgres_data:
  redis_data:

networks:
  ultra-ai-network:
    driver: bridge