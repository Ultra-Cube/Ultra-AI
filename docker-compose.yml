version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ultra-ai-postgres
    environment:
      POSTGRES_DB: ultra_ai_db
      POSTGRES_USER: ultra_ai_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ultra_ai_dev_password}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ultra-ai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultra_ai_user -d ultra_ai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: ultra-ai-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ultra_ai_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ultra_ai_dev_password}
      MONGO_INITDB_DATABASE: ultra_ai_db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./infrastructure/docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - ultra-ai-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ultra-ai-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-ultra_ai_dev_password} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ultra-ai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # IPFS Node
  ipfs:
    image: ipfs/kubo:latest
    container_name: ultra-ai-ipfs
    environment:
      - IPFS_PROFILE=server
    ports:
      - "4001:4001"     # P2P TCP
      - "5001:5001"     # API
      - "8080:8080"     # Gateway
    volumes:
      - ipfs-data:/data/ipfs
    networks:
      - ultra-ai-network

  # Adminer (Database Management)
  adminer:
    image: adminer:latest
    container_name: ultra-ai-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    networks:
      - ultra-ai-network
    depends_on:
      - postgres
      - mongodb

  # Redis Commander (Redis Management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ultra-ai-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-ultra_ai_dev_password}
    ports:
      - "8082:8081"
    networks:
      - ultra-ai-network
    depends_on:
      - redis

networks:
  ultra-ai-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:
  ipfs-data:
